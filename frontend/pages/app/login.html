<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function() {
      var user = localStorage.getItem('credora_user');
      if (user) {
        var target = sessionStorage.getItem('credora_redirect_after_login') || 'dashboard.html';
        sessionStorage.removeItem('credora_redirect_after_login');
        if (target.indexOf('pages/app/') !== -1) {
          target = target.substring(target.indexOf('pages/app/') + 10);
        } else if (target.indexOf('../app/') !== -1) {
          target = target.substring(target.indexOf('../app/') + 7);
        }
        if (!target || target === '/' || target.indexOf('index.html') !== -1 || target.indexOf('login.html') !== -1) {
          target = 'dashboard.html';
        }
        window.location.replace(target);
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }
    body {
      background-color: #F8FAFC;
      color: #0A0A0A;
      -webkit-font-smoothing: antialiased;
    }
    .font-heading {
      font-family: 'Outfit', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

</head>
<body class="min-h-screen flex flex-col justify-between bg-[#F8FAFC] text-[#0A0A0A]">

  <!-- Top Minimal Bar -->
  <header class="w-full h-16 bg-white border-b border-[#E2E8F0] px-6 lg:px-12 flex items-center justify-between sticky top-0 z-30">
    <a href="../../index.html" class="flex items-center gap-2 text-[#0A0A0A] hover:opacity-90 transition-opacity">
      <!-- Minimal Piggy Bank SVG Icon -->
      
      <span class="font-heading font-bold text-xl tracking-tight text-[#0A0A0A]">Credora</span>
    </a>

    <div>
      <a href="../../index.html" class="text-sm font-medium text-[#475569] hover:text-[#0A0A0A] transition-colors flex items-center gap-1.5">
        <span class="text-xs">←</span> Back to Home
      </a>
    </div>
  </header>

  <!-- Centered Authentication Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[420px] bg-white border border-[#E2E8F0] rounded-lg p-8 sm:p-9 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
      
      <!-- Card Header -->
      <div class="mb-6">
        
        <h1 class="font-heading text-2xl font-bold tracking-tight text-[#0A0A0A] mb-1.5">
          Sign in to Credora
        </h1>
        <p class="text-sm text-[#475569] leading-relaxed">
          Access your loan applications and instant ML pre-screening status.
        </p>
      </div>

      <!-- Clean Tab Switcher -->
      <div class="flex border-b border-[#E2E8F0] mb-6">
        <button type="button" class="pb-2.5 text-sm font-semibold text-[#0A0A0A] border-b-2 border-[#0A0A0A] mr-6 transition-colors">
          Sign In
        </button>
        <button type="button" class="pb-2.5 text-sm font-medium text-[#64748B] hover:text-[#0A0A0A] transition-colors">
          Create Account
        </button>
      </div>

      <!-- Sign In Form -->
      <form onsubmit="event.preventDefault();" class="space-y-4">
        <!-- Input 1: Email or Mobile -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[#334155] mb-1.5">
            Email or Mobile
          </label>
          <div class="relative">
            <input type="text" placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-white border border-[#CBD5E1] rounded-md text-sm text-[#0A0A0A] placeholder-[#94A3B8] font-normal focus:outline-none focus:border-[#0A0A0A] focus:ring-1 focus:ring-[#0A0A0A] transition-all" required="">
          </div>
        </div>

        <!-- Input 2: Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#334155]">
              Password
            </label>
            <a href="#" class="text-xs font-medium text-[#1A73E8] hover:underline">
              Forgot password?
            </a>
          </div>
          <div class="relative flex items-center">
            <input id="passwordInput" type="password" placeholder="••••••••••••" class="w-full pl-3.5 pr-12 py-2.5 bg-white border border-[#CBD5E1] rounded-md text-sm text-[#0A0A0A] placeholder-[#94A3B8] font-mono-code focus:outline-none focus:border-[#0A0A0A] focus:ring-1 focus:ring-[#0A0A0A] transition-all" required="">
            <button type="button" onclick="const pwd = document.getElementById('passwordInput'); if(pwd.type==='password'){pwd.type='text'; this.innerText='Hide';} else {pwd.type='password'; this.innerText='Show';}" class="absolute right-3 text-xs font-medium text-[#64748B] hover:text-[#0A0A0A] transition-colors focus:outline-none">
              Show
            </button>
          </div>
        </div>

        <!-- Checkbox: Remember Session -->
        <div class="pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" checked="" class="w-4 h-4 rounded border-[#CBD5E1] text-[#0A0A0A] focus:ring-0 focus:ring-offset-0 accent-[#0A0A0A] cursor-pointer">
            <span class="text-[13px] text-[#475569]">
              Keep me signed in on this device
            </span>
          </label>
        </div>

        <!-- Primary Action Button -->
        <div class="pt-2">
          <button type="submit" class="w-full h-11 bg-[#0A0A0A] hover:bg-[#1E293B] text-white rounded-md text-sm font-medium flex items-center justify-center gap-1.5 transition-colors shadow-sm">
            <span>Continue to Portal</span>
            <span class="text-base leading-none">→</span>
          </button>
        </div><div class="relative flex items-center justify-center my-4"><div class="w-full border-t border-[#E2E8F0]"></div><span class="absolute bg-white px-3 text-xs text-[#64748B] uppercase tracking-wider">or</span></div><button type="button" class="w-full h-11 bg-white hover:bg-[#F8FAFC] text-[#0F172A] border border-[#CBD5E1] rounded-md text-sm font-medium flex items-center justify-center gap-2.5 transition-colors shadow-sm"><svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path></svg><span>Continue with Google</span></button>
      </form>

      <!-- Hairline Divider -->
      <div class="my-6 border-t border-[#E2E8F0]"></div>

      <!-- Role Switch Link -->
      <div class="text-center">
        <p class="text-[13px] text-[#475569]">
          Are you a Credora Loan Officer?
        </p>
        <a href="../admin/admin-login.html" class="inline-flex items-center gap-1 text-[13px] font-medium text-[#1A73E8] hover:underline mt-1">
          <span>Sign in to Officer Portal</span>
          <span>→</span>
        </a>
      </div>

    </div>
  </main>

  <!-- Minimal Single-Line Footer -->
  <footer class="w-full bg-white border-t border-[#E2E8F0] py-5 px-6 text-center">
    <p class="text-xs text-[#64748B]">
      © 2026 Credora Open Source Organization • Secure Applicant Authentication (Project Purpose Only)
    </p>
  </footer>




<span id="PING_CONTENT_PUSH_NOTIFICATION" style="display: none;"></span>

<span id="PING_CONTENT_PUSH_NOTIFICATION" style="display: none;"></span>
<script type="module">
  import { loginWithGoogle, loginWithEmail } from "../../public/assets/js/core/auth.js";
  import { setButtonLoading } from "../../public/assets/js/core/app.js";

  document.querySelectorAll('button').forEach(btn => {
    if (btn.innerText.includes('Continue with Google')) {
      btn.addEventListener('click', async () => {
        setButtonLoading(btn, true, 'Connecting to Google...');
        try {
          await loginWithGoogle();
        } catch (e) {
          setButtonLoading(btn, false);
        }
      });
    }
  });

  const form = document.querySelector('form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      if (submitBtn) setButtonLoading(submitBtn, true, 'Signing In...');
      const emailInput = form.querySelector('input[type="text"], input[type="email"]');
      const pwdInput = document.getElementById('passwordInput');
      const email = emailInput && emailInput.value ? emailInput.value : 'applicant@credora.org';
      const pwd = pwdInput && pwdInput.value ? pwdInput.value : 'password123';
      try {
        await loginWithEmail(email, pwd);
      } catch (err) {
        if (submitBtn) setButtonLoading(submitBtn, false);
      }
    });
  }
</script>

</body></html>
