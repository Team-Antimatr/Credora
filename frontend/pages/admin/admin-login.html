<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credora — Staff & Officer Verification Portal</title>
  <script>
    (function() {
      var role = localStorage.getItem('credora_user_role');
      if (role === 'officer' || role === 'admin') {
        var target = sessionStorage.getItem('credora_admin_redirect') || 'review-queue.html';
        sessionStorage.removeItem('credora_admin_redirect');
        window.location.replace(target);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-[#F8FAFC] text-[#0F172A] font-['Inter'] antialiased">
  <!-- Minimal Top Header -->
  <header class="w-full bg-white border-b border-[#E2E8F0] h-16 flex items-center px-6 justify-between">
    <a href="../../index.html" class="flex items-center gap-2 text-[#0F172A]">
      <span class="font-['Outfit'] font-bold text-xl tracking-tight">Credora</span>
      <span class="text-xs bg-[#0F172A] text-white px-2 py-0.5 rounded font-mono">STAFF</span>
    </a>
    <a href="../app/login.html" class="text-xs font-medium text-[#64748B] hover:text-[#0F172A] transition-colors">
      Switch to Customer Portal →
    </a>
  </header>

  <!-- Login Main -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-[420px] bg-white border border-[#CBD5E1] rounded-xl p-8 shadow-sm">
      <div class="mb-6">
        <h1 class="font-['Outfit'] text-2xl font-bold text-[#0F172A] tracking-tight">
          Credit Officer Sign In
        </h1>
        <p class="text-xs text-[#64748B] mt-1.5 leading-relaxed">
          Authorized banking personnel and loan officers verification portal.
        </p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">
            Staff ID / Official Email
          </label>
          <input type="email" id="adminEmail" value="anita.deshmukh@credora.internal" class="w-full px-3.5 py-2.5 bg-white border border-[#CBD5E1] rounded-md text-sm text-[#0F172A] focus:outline-none focus:border-[#0F172A] focus:ring-1 focus:ring-[#0F172A] transition-all" required>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569]">
              Password
            </label>
          </div>
          <div class="relative">
            <input type="password" id="adminPassword" value="••••••••••••" class="w-full px-3.5 py-2.5 bg-white border border-[#CBD5E1] rounded-md text-sm text-[#0F172A] focus:outline-none focus:border-[#0F172A] focus:ring-1 focus:ring-[#0F172A] transition-all" required>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-[#64748B] pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded border-[#CBD5E1] text-[#0F172A] accent-[#0F172A]">
            <span>Keep session active</span>
          </label>
          <span class="text-[#0058BB] font-medium">Central Desk</span>
        </div>

        <button type="submit" class="w-full h-11 bg-[#0F172A] hover:bg-[#1E293B] text-white rounded-md text-sm font-medium flex items-center justify-center gap-2 transition-colors shadow-sm mt-2">
          <span>Authenticate Officer Session</span>
          <span class="text-xs font-mono">→</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-[#E2E8F0] text-center">
        <p class="text-[11px] text-[#94A3B8]">
          Restricted access. All login attempts and review actions are monitored under regulatory audit protocol.
        </p>
      </div>
    </div>
  </main>

  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      // Store staff session in localStorage
      localStorage.setItem('credora_user_role', 'officer');
      localStorage.setItem('credora_officer_name', 'Anita Deshmukh (Central Desk)');
      var target = sessionStorage.getItem('credora_admin_redirect') || 'review-queue.html';
      sessionStorage.removeItem('credora_admin_redirect');
      window.location.replace(target);
    }
  </script>
</body>
</html>
